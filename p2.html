<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Plan ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px 10px;
    overflow-x: hidden;
    overflow-y: auto;
}

.card {
    width: 100%;
    max-width: 620px;
    background: white;
    border-radius: 22px;
    padding: 25px 18px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
}

h1 {
    color: #e91e63;
    font-size: 35px;
}

p {
    color: #555;
    font-size: 17px;
}

.hidden {
    display: none !important;
}

button {
    border: none;
    border-radius: 14px;
    padding: 14px 20px;
    margin: 8px 4px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: translateY(-3px);
    box-shadow: 0 7px 18px rgba(0,0,0,0.15);
}

.yes {
    background: #e91e63;
    color: white;
    min-width: 130px;
}

#noButton {
    position: fixed;
    z-index: 9999;
    background: #555;
    color: white;
    min-width: 130px;
    right: 20px;
    bottom: 20px;
}

.option {
    display: block;
    width: 100%;
    margin: 9px 0;
    padding: 15px;
    background: #f7f7f7;
    color: #333;
    border: 2px solid transparent;
    text-align: left;
}

.option:hover {
    background: #fff0f5;
}

.option.selected {
    background: #ffe0eb;
    border-color: #e91e63;
    color: #c2185b;
}

.location {
    display: block;
    margin-top: 5px;
    font-size: 13px;
    font-weight: normal;
    color: #777;
}

.next,
.confirm,
.restart {
    width: 90%;
    max-width: 350px;
    color: white;
}

.next {
    background: #673ab7;
}

.confirm {
    background: #009688;
}

.restart {
    background: #ff9800;
}

label {
    display: block;
    text-align: left;
    font-weight: bold;
    margin: 12px 0 6px;
}

input,
select {
    width: 100%;
    padding: 14px;
    border: 2px solid #ddd;
    border-radius: 12px;
    font-size: 16px;
}

.summary {
    background: #fff0f5;
    border-radius: 15px;
    padding: 18px;
    text-align: left;
    margin-top: 15px;
    line-height: 1.8;
}

.success {
    font-size: 45px;
}

@media (max-width: 480px) {

    body {
        padding: 10px 7px;
    }

    .card {
        padding: 20px 13px;
    }

    button {
        font-size: 15px;
    }

    #noButton {
        min-width: 115px;
    }
}
</style>
</head>

<body>

<div class="card">

<!-- STEP 1 -->
<div id="step1">

    <h1>Hey 👀❤️</h1>

    <p>
        Would you like to make a plan?
    </p>

    <button class="yes" id="yesButton">
        YES ❤️
    </button>

    <button id="noButton">
        NO 😭
    </button>

</div>


<!-- STEP 2 -->
<div id="step2" class="hidden">

    <h1>Pick a place 📍</h1>

    <p>
        Choose where you would like to go.
    </p>

    <button class="option restaurant"
        data-value="Talisman Restaurant"
        data-location="Karen, Nairobi">

        Talisman Restaurant

        <span class="location">
            📍 Karen, Nairobi
        </span>

    </button>


    <button class="option restaurant"
        data-value="CJ's Restaurant"
        data-location="Nairobi">

        CJ's Restaurant

        <span class="location">
            📍 Nairobi
        </span>

    </button>


    <button class="option restaurant"
        data-value="Fogo Gaucho"
        data-location="Westlands, Nairobi">

        Fogo Gaucho

        <span class="location">
            📍 Westlands, Nairobi
        </span>

    </button>


    <button class="option restaurant"
        data-value="About Thyme Restaurant"
        data-location="Parklands, Nairobi">

        About Thyme Restaurant

        <span class="location">
            📍 Parklands, Nairobi
        </span>

    </button>


    <button class="option restaurant"
        data-value="The View"
        data-location="Nairobi">

        The View

        <span class="location">
            📍 Nairobi
        </span>

    </button>


    <button class="option restaurant"
        data-value="Mambo Italia"
        data-location="Nairobi">

        Mambo Italia

        <span class="location">
            📍 Nairobi
        </span>

    </button>


    <button class="next" id="restaurantNext">
        NEXT →
    </button>

</div>


<!-- STEP 3 -->
<div id="step3" class="hidden">

    <h1>Choose your food 🍕</h1>

    <p>
        What would you like to eat?
    </p>

    <button class="option food" data-value="Pizza">
        🍕 Pizza
    </button>

    <button class="option food" data-value="Burger">
        🍔 Burger
    </button>

    <button class="option food" data-value="Chicken">
        🍗 Chicken
    </button>

    <button class="option food" data-value="Pasta">
        🍝 Pasta
    </button>

    <button class="option food" data-value="Steak">
        🥩 Steak
    </button>

    <button class="option food" data-value="Fish">
        🐟 Fish
    </button>

    <button class="option food" data-value="Fries">
        🍟 Fries
    </button>

    <button class="option food" data-value="Sushi">
        🍣 Sushi
    </button>

    <button class="option food" data-value="Tacos">
        🌮 Tacos
    </button>

    <button class="option food" data-value="Ice Cream">
        🍦 Ice Cream
    </button>

    <button class="next" id="foodNext">
        NEXT →
    </button>

</div>


<!-- STEP 4 -->
<div id="step4" class="hidden">

    <h1>Choose an activity 🎉</h1>

    <p>
        What should we do?
    </p>

    <button class="option activity"
        data-value="Watch a Movie">

        🎬 Watch a Movie

    </button>


    <button class="option activity"
        data-value="Take a Walk">

        🚶 Take a Walk

    </button>


    <button class="option activity"
        data-value="Get Ice Cream">

        🍦 Get Ice Cream

    </button>


    <button class="option activity"
        data-value="Play Games">

        🎮 Play Games

    </button>


    <button class="option activity"
        data-value="Just Chill">

        😌 Just Chill

    </button>


    <button class="next" id="activityNext">
        NEXT →
    </button>

</div>


<!-- STEP 5 -->
<div id="step5" class="hidden">

    <h1>Pick the date & time 📅</h1>

    <label for="date">
        Date
    </label>

    <input type="date" id="date">


    <label for="time">
        Time
    </label>

    <select id="time">

        <option value="">
            Choose a time
        </option>

        <option>10:00 AM</option>
        <option>11:00 AM</option>
        <option>12:00 PM</option>
        <option>1:00 PM</option>
        <option>2:00 PM</option>
        <option>3:00 PM</option>
        <option>4:00 PM</option>
        <option>5:00 PM</option>
        <option>6:00 PM</option>
        <option>7:00 PM</option>
        <option>8:00 PM</option>

    </select>


    <button class="confirm" id="confirmButton">
        CONFIRM ❤️
    </button>

</div>


<!-- FINAL STEP -->
<div id="finalStep" class="hidden">

    <div class="success">
        🎉❤️
    </div>

    <h1>
        Plan Confirmed!
    </h1>

    <p>
        Here is the plan:
    </p>

    <div id="summary" class="summary">
    </div>

    <button class="restart" id="restartButton">
        START AGAIN 🔄
    </button>

</div>

</div>


<script>

"use strict";


/* VARIABLES */

let restaurant = "";
let restaurantLocation = "";
let food = "";
let activity = "";


/* STEP FUNCTION */

function showStep(step) {

    document.getElementById("step1")
        .classList.add("hidden");

    document.getElementById("step2")
        .classList.add("hidden");

    document.getElementById("step3")
        .classList.add("hidden");

    document.getElementById("step4")
        .classList.add("hidden");

    document.getElementById("step5")
        .classList.add("hidden");

    document.getElementById("finalStep")
        .classList.add("hidden");


    document.getElementById(step)
        .classList.remove("hidden");


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* YES BUTTON */

document.getElementById("yesButton")
.addEventListener("click", function() {

    showStep("step2");

});


/* NO BUTTON */

const noButton =
    document.getElementById("noButton");


const noMessages = [

    "NO 😭",

    "ARE YOU SURE? 😭",

    "CATCH ME! 🏃",

    "NOPE 😂",

    "TOO SLOW! 🏃💨",

    "TRY AGAIN 😭",

    "NOT TODAY! 😂",

    "YOU MISSED ME! 🏃",

    "NOOOO 😭❤️"

];


let noIndex = 0;


function moveNoButton() {

    const padding = 10;


    const maxX =
        window.innerWidth -
        noButton.offsetWidth -
        padding;


    const maxY =
        window.innerHeight -
        noButton.offsetHeight -
        padding;


    const x =
        Math.floor(
            Math.random() *
            Math.max(maxX, padding)
        );


    const y =
        Math.floor(
            Math.random() *
            Math.max(maxY, padding)
        );


    noButton.style.left =
        x + "px";

    noButton.style.top =
        y + "px";


    noButton.style.right =
        "auto";

    noButton.style.bottom =
        "auto";


    noButton.textContent =
        noMessages[noIndex];


    noIndex++;

    if (noIndex >= noMessages.length) {
        noIndex = 0;
    }
}


/* COMPUTER */

noButton.addEventListener(
    "mouseenter",
    moveNoButton
);


/* PHONE */

noButton.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        moveNoButton();

    },
    {
        passive: false
    }
);


/* RESTAURANT SELECTION */

document.querySelectorAll(
    ".restaurant"
).forEach(function(button) {

    button.addEventListener(
        "click",
        function() {

            document
            .querySelectorAll(".restaurant")
            .forEach(function(btn) {

                btn.classList.remove(
                    "selected"
                );

            });


            button.classList.add(
                "selected"
            );


            restaurant =
                button.dataset.value;


            restaurantLocation =
                button.dataset.location;

        }
    );

});


/* RESTAURANT NEXT */

document.getElementById(
    "restaurantNext"
).addEventListener(
    "click",
    function() {

        if (restaurant === "") {

            alert(
                "Please choose a place first 📍"
            );

            return;
        }


        showStep("step3");

    }
);


/* FOOD */

document.querySelectorAll(
    ".food"
).forEach(function(button) {

    button.addEventListener(
        "click",
        function() {

            document
            .querySelectorAll(".food")
            .forEach(function(btn) {

                btn.classList.remove(
                    "selected"
                );

            });


            button.classList.add(
                "selected"
            );


            food =
                button.dataset.value;

        }
    );

});


/* FOOD NEXT */

document.getElementById(
    "foodNext"
).addEventListener(
    "click",
    function() {

        if (food === "") {

            alert(
                "Please choose your food first 🍕"
            );

            return;
        }


        showStep("step4");

    }
);


/* ACTIVITY */

document.querySelectorAll(
    ".activity"
).forEach(function(button) {

    button.addEventListener(
        "click",
        function() {

            document
            .querySelectorAll(".activity")
            .forEach(function(btn) {

                btn.classList.remove(
                    "selected"
                );

            });


            button.classList.add(
                "selected"
            );


            activity =
                button.dataset.value;

        }
    );

});


/* ACTIVITY NEXT */

document.getElementById(
    "activityNext"
).addEventListener(
    "click",
    function() {

        if (activity === "") {

            alert(
                "Please choose an activity first 🎉"
            );

            return;
        }


        showStep("step5");

    }
);


/* DATE */

const dateInput =
    document.getElementById("date");


const today =
    new Date();


const year =
    today.getFullYear();


const month =
    String(
        today.getMonth() + 1
    ).padStart(2, "0");


const day =
    String(
        today.getDate()
    ).padStart(2, "0");


dateInput.min =
    year + "-" +
    month + "-" +
    day;


/* CONFIRM */

document.getElementById(
    "confirmButton"
).addEventListener(
    "click",
    function() {

        const date =
            dateInput.value;


        const time =
            document.getElementById(
                "time"
            ).value;


        if (date === "") {

            alert(
                "Please choose a date 📅"
            );

            return;
        }


        if (time === "") {

            alert(
                "Please choose a time ⏰"
            );

            return;
        }


        const selectedDate =
            new Date(
                date + "T12:00:00"
            );


        const formattedDate =
            selectedDate.toLocaleDateString(
                "en-US",
                {
                    weekday: "long",
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                }
            );


        document.getElementById(
            "summary"
        ).innerHTML =

            "<strong>📍 Place:</strong> " +
            restaurant +

            "<br><strong>📌 Location:</strong> " +
            restaurantLocation +

            "<br><strong>🍽️ Food:</strong> " +
            food +

            "<br><strong>🎉 Activity:</strong> " +
            activity +

            "<br><strong>📅 Date:</strong> " +
            formattedDate +

            "<br><strong>⏰ Time:</strong> " +
            time;


        showStep("finalStep");

    }
);


/* RESTART */

document.getElementById(
    "restartButton"
).addEventListener(
    "click",
    function() {

        restaurant = "";
        restaurantLocation = "";
        food = "";
        activity = "";


        document
        .querySelectorAll(".option")
        .forEach(function(button) {

            button.classList.remove(
                "selected"
            );

        });


        dateInput.value = "";


        document.getElementById(
            "time"
        ).value = "";


        showStep("step1");


        noButton.style.left =
            "auto";

        noButton.style.top =
            "auto";

        noButton.style.right =
            "20px";

        noButton.style.bottom =
            "20px";


        noButton.textContent =
            "NO 😭";


        noIndex = 0;

    }
);

</script>

</body>
</html>
